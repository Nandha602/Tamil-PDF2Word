name: Build and release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-build.txt
          pip uninstall -y pymupdf-layout pymupdf4llm
        shell: bash
      - name: Build exe
        run: pyinstaller --noconfirm --clean --onefile --windowed --exclude-module pymupdf.layout --collect-all uharfbuzz --name PDF2Word pdf2word.py
      - name: Checksum
        run: sha256sum dist/PDF2Word.exe > dist/PDF2Word.exe.sha256.txt
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: PDF2Word-windows
          path: dist/PDF2Word.exe
      - name: Attach to GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/PDF2Word.exe
            dist/PDF2Word.exe.sha256.txt
          generate_release_notes: true
